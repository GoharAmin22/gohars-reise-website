name: Update Deutschland-Monitor data
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve official Eurostat figures
        run: python scripts/update_monitor_data.py
      - name: Commit only changed values
        run: |
          git add deutschland-monitor/data.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Deutschland-Monitor official figures"
            git push
          fi
